name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.line }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: qwen3-8
            markdown_globs: "qwen3-8/README.md qwen3-8/docs/**/*.md qwen3-8/CONTRIBUTING.md"
            tuning_tables: false
          - line: deepseek-v4-flash
            markdown_globs: "deepseek-v4-flash/README.md deepseek-v4-flash/docs/**/*.md deepseek-v4-flash/tuning/**/*.md deepseek-v4-flash/CONTRIBUTING.md"
            tuning_tables: true
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./${{ matrix.line }}/scripts"
          severity: warning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall -q scripts/
        working-directory: ${{ matrix.line }}
      - name: Validate MI308X tuning tables
        if: matrix.tuning_tables
        run: python scripts/validate_tuning_tables.py
        working-directory: ${{ matrix.line }}
      - name: Benchmark CLI imports
        run: |
          python scripts/bench/bench_agent_trace.py --help >/dev/null
          python scripts/bench/bench_session_concurrency.py --help >/dev/null
          python scripts/bench/bench_tool_roundtrip.py --help >/dev/null
          python scripts/bench/bench_ttft_isolation.py --help >/dev/null
        working-directory: ${{ matrix.line }}
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: ${{ matrix.markdown_globs }}
